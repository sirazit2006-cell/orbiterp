# Local and single-server setup: MySQL 8 + Laravel API + React app behind nginx.
#   cp backend/.env.example backend/.env   (set APP_KEY with: docker compose run --rm api php artisan key:generate --show)
#   docker compose up --build
# Then open http://localhost:8080 and sign in as admin / ChangeMe@123 (change it straight away).
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: orbiterp
      MYSQL_USER: orbiterp
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes: [db-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      retries: 20

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    env_file: backend/.env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: orbiterp
      DB_USERNAME: orbiterp
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes: [api-storage:/app/storage/app]
    depends_on:
      db: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  db-data:
  api-storage:
